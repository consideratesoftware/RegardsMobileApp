name: Audit stress

# Runs the RegardsAccessibilityTests audit suite 5 times nightly and by manual
# dispatch to catch probabilistic flakes. Each run is its own matrix job, so
# one job's time limit covers one suite run. The single-run `Accessibility
# audit` in `iOS CI` runs after merges to main; neither audit is a per-PR
# gate.
#
# Sizing, from run 44144949564 (cancelled at the old 120-minute limit): the
# suite has 82 tests (2 skipped) and one run takes about 30 minutes (29.9,
# 30.9 and 29.1 in iterations 1 to 3). Boot took 3.6 minutes and the build 3.7.
# Five iterations in one job would need about 157 minutes, and each added test
# costs about 22 seconds per iteration, so 5 iterations in a row add about 1.9
# minutes per test. As a matrix of 5 jobs with 2 in parallel, growth costs
# about 22 seconds per test per job. With 2 jobs at a time, the 5 jobs run in
# 3 rounds.
#
# This used to run on every pull request. The header claimed "5-6 minutes
# per PR"; six consecutive real runs took 23, 23, 29, 33, 38 and 49 minutes,
# a 33-minute mean on `macos-latest`, which bills at 10x the Linux rate. That
# is roughly 330 Linux-equivalent minutes per push to gate a probabilistic
# signal, and a flake in it blocked PRs that had nothing to do with
# accessibility.
#
# So it moved off the PR path:
#   - nightly, to accumulate flake evidence over time
#   - workflow_dispatch, to run it on demand before cutting a release
#
# A failure here is triaged on main rather than blocking an unrelated PR.
# Before a TestFlight build, run it manually and require it green -- that is
# the release gate this now serves.
#
# It is no longer a required status check. If you re-add `pull_request` here,
# re-add the context to branch protection in the same change; and if you make
# it a required context again, do NOT add path filters, because a
# path-filtered workflow never reports on unrelated PRs and the missing
# required check blocks the merge.

on:
  schedule:
    # 09:00 UTC daily. Cron here is always UTC, never local.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-stress-${{ github.ref }}
  # Never cancel the in-flight run. GitHub keeps one running and only the latest
  # pending run per group, so overlapping nightly or manual signals may
  # coalesce before they start.
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"
  # Keep this device pin aligned with ios-ci.yml's SIMULATOR_NAME.
  # scripts/prepare-audit-simulator.sh resolves it to the newest installed
  # iOS runtime and pins every xcodebuild -destination to that exact UDID
  # via $SIMULATOR_UDID instead of re-resolving OS=latest.
  SIMULATOR_NAME: "iPhone 17 Pro"
  SCHEME: Regards

jobs:
  audit-stress:
    name: Accessibility audit stress (5x)
    runs-on: macos-latest
    strategy:
      # Each job is one suite run. Let all 5 finish so one flake does not hide
      # the others.
      fail-fast: false
      # macos-latest bills at 10x Linux and shares runners with iOS CI, so
      # run at most 2 of the 5 at once.
      max-parallel: 2
      matrix:
        run: [1, 2, 3, 4, 5]
    # One job is one suite run. Boot took 3.6 minutes in run 44144949564 and
    # 9.7 in run 44339078682, where build and test took 40.1 minutes at
    # c79348d (about 50 minutes in all).
    # 90 minutes leaves room for both and bounds the 2026-08-08-class hang at
    # 8adeb0d instead of letting it run out the default 6-hour job limit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install iOS platform
        # Same retry wrapper as `iOS CI` — the CDN flakes intermittently.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              [ "$attempt" -gt 1 ] && echo "downloadPlatform succeeded on attempt $attempt (after retries)"
              exit 0
            fi
            echo "::warning::downloadPlatform failed on attempt $attempt; sleeping 15s before retry"
            sleep 15
          done
          echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts"
          exit 1
      - name: Boot accessibility simulator
        # Same as `iOS CI`'s accessibility-audit job: resolves the pinned
        # device to one UDID, boots it, and publishes SIMULATOR_UDID so the
        # test step below pins its -destination to that exact device. See
        # scripts/prepare-audit-simulator.sh for why this step's timeout is
        # the hang bound.
        timeout-minutes: 20
        run: scripts/prepare-audit-simulator.sh "$SIMULATOR_NAME"
      - name: Run RegardsAccessibilityTests (run ${{ matrix.run }} of 5)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Regards.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -configuration Debug \
            -only-testing:RegardsAccessibilityTests \
            -resultBundlePath build/RegardsTests-${{ matrix.run }}.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test \
            | xcbeautify --renderer github-actions
      - name: Upload xcresult
        # A job the 90-minute limit cancels is cancelled, and failure() is
        # false then, so the partial xcresult needs the cancelled() check.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: RegardsTests-${{ matrix.run }}.xcresult
          path: ios/build/RegardsTests-${{ matrix.run }}.xcresult
