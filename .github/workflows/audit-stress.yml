name: Audit stress

# Runs the RegardsAccessibilityTests audit suite 5 times nightly and by manual
# dispatch to catch probabilistic flakes. The single-run `Accessibility audit`
# in `iOS CI` runs after merges to main; neither audit is a per-PR gate.
#
# This used to run on every pull request. The header claimed "5-6 minutes
# per PR"; six consecutive real runs took 23, 23, 29, 33, 38 and 49 minutes,
# a 33-minute mean on `macos-latest`, which bills at 10x the Linux rate. That
# is roughly 330 Linux-equivalent minutes per push to gate a probabilistic
# signal, and a flake in it blocked PRs that had nothing to do with
# accessibility.
#
# So it moved off the PR path:
#   - nightly, to accumulate flake evidence over time
#   - workflow_dispatch, to run it on demand before cutting a release
#
# A failure here is triaged on main rather than blocking an unrelated PR.
# Before a TestFlight build, run it manually and require it green -- that is
# the release gate this now serves.
#
# It is no longer a required status check. If you re-add `pull_request` here,
# re-add the context to branch protection in the same change; and if you make
# it a required context again, do NOT add path filters, because a
# path-filtered workflow never reports on unrelated PRs and the missing
# required check blocks the merge.

on:
  schedule:
    # 09:00 UTC daily. Cron here is always UTC, never local.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-stress-${{ github.ref }}
  # Never cancel the in-flight run. GitHub keeps one running and only the latest
  # pending run per group, so overlapping nightly or manual signals may
  # coalesce before they start.
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"
  # Keep this device pin aligned with ios-ci.yml's SIMULATOR_NAME.
  # scripts/prepare-audit-simulator.sh resolves it to the newest installed
  # iOS runtime and pins every xcodebuild -destination to that exact UDID
  # via $SIMULATOR_UDID instead of re-resolving OS=latest.
  SIMULATOR_NAME: "iPhone 17 Pro"
  SCHEME: Regards
  STRESS_RUNS: "5"

jobs:
  audit-stress:
    name: Accessibility audit stress (5x)
    runs-on: macos-latest
    # Comfortable margin over the 49-minute worst observed full-workflow run
    # (see header). Bounds the 2026-08-08-class hang at 8adeb0d instead of
    # letting it run out the default 6-hour job limit.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install iOS platform
        # Same retry wrapper as `iOS CI` — the CDN flakes intermittently.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              [ "$attempt" -gt 1 ] && echo "downloadPlatform succeeded on attempt $attempt (after retries)"
              exit 0
            fi
            echo "::warning::downloadPlatform failed on attempt $attempt; sleeping 15s before retry"
            sleep 15
          done
          echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts"
          exit 1
      - name: Boot accessibility simulator
        # Same as `iOS CI`'s accessibility-audit job: resolves the pinned
        # device to one UDID, boots it, and publishes SIMULATOR_UDID so both
        # steps below pin their -destination to that exact device for all 5
        # iterations. See scripts/prepare-audit-simulator.sh.
        timeout-minutes: 10
        run: scripts/prepare-audit-simulator.sh "$SIMULATOR_NAME"
      - name: Build accessibility test bundle once
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Regards.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -configuration Debug \
            -only-testing:RegardsAccessibilityTests \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing \
            | xcbeautify --renderer github-actions
      - name: Stress-run audit (${{ env.STRESS_RUNS }}x)
        working-directory: ios
        run: |
          set -o pipefail
          failed=0
          for run in $(seq 1 ${{ env.STRESS_RUNS }}); do
            echo "::group::Audit run $run/${{ env.STRESS_RUNS }}"
            if xcodebuild \
                -project Regards.xcodeproj \
                -scheme "$SCHEME" \
                -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
                -configuration Debug \
                -only-testing:RegardsAccessibilityTests \
                -onlyUsePackageVersionsFromResolvedFile \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                test-without-building \
                | xcbeautify --renderer github-actions
            then
              echo "::endgroup::"
              echo "    run $run: pass"
            else
              echo "::endgroup::"
              echo "::error::Audit run $run/${{ env.STRESS_RUNS }} failed"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed of ${{ env.STRESS_RUNS }} audit runs failed"
            exit 1
          fi
          echo "All ${{ env.STRESS_RUNS }} audit runs passed."
