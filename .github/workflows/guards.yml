name: Guards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-agent-parity:
    name: Review agent parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare Codex and Claude reviewer contracts
        run: scripts/check-review-agent-parity.sh
      - name: Verify source-boundary guard parity
        run: scripts/tests/source-boundary-guard-tests.sh

  privacy-grep:
    name: No networking code (§11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan Regards/ for networking call sites
        run: scripts/check-no-network.sh

  domain-purity-grep:
    name: Domain layer is platform-free (§5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan ios/Regards/Domain for platform imports
        run: scripts/check-domain-purity.sh

  android-manifest-guard:
    name: Android manifest forbids network permissions (§11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify no INTERNET/ACCESS_NETWORK_STATE and strip lines intact
        run: scripts/check-android-manifest.sh

  android-privacy-grep:
    name: Android sources are network-free (§11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan android/ for networking call sites
        run: scripts/check-android-no-network.sh

  android-domain-purity-grep:
    name: Android domain layer is platform-free (§5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan android/domain for platform imports
        run: scripts/check-android-domain-purity.sh

  yaml-lint:
    name: project.yml syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate project.yml is parseable YAML
        run: python3 -c "import yaml,sys; yaml.safe_load(open('ios/project.yml'))"

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check iOS documentation links
        uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
        with:
          config-file: .github/markdown-link-check.json
          folder-path: "ios/docs"
          file-extension: ".md"
      - name: Check root documentation links
        uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
        with:
          config-file: .github/markdown-link-check.json
          folder-path: "."
          max-depth: "1"
          file-extension: ".md"
