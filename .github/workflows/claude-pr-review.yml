name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; review when a PR opens, updates, or leaves draft
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test review artifact validator
        run: scripts/tests/validate-hosted-review-artifact-tests.sh

      - name: Record review start
        run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/review-started-at"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the reviewer for Regards. The PR branch is checked out in
            the current working directory.

            Follow the repository's staged review protocol defined in
            `.claude/commands/pr-review.md`, with these CI adaptations:

            - Skip the Stage 0 mechanical gates (xcodegen determinism,
              swiftlint, privacy greps) — they run in the ios-ci, lint, and
              guards workflows on this PR. Instead, check their status with
              `gh pr checks` and report it in the PRE-FLIGHT line.
            - Read `ARCHITECTURE.md` §18 → §19 → §14 first, then the sections
              the diff touches. The dispatch table, merge rules, register
              hygiene (R-closure verification), and output format in
              `.claude/commands/pr-review.md` apply as written; use the
              project subagents in `.claude/agents/`.
            - Diff target: the PR's merge base with the base branch
              (`gh pr diff` or `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`).
            - Artifact identity: immediately after the review heading, add the
              line `HEAD SHA: ${{ github.event.pull_request.head.sha }}`.

            Your one deliverable is the file `/tmp/pr-review.md`, containing
            the single merged review in the exact Stage 3 structure. Write it
            with the Write tool. The workflow posts it for you — do not run
            `gh pr comment`, and do not put the review in a chat message. A run
            that ends without that file is a failed run, so write it even when
            the review is short or the verdict is obvious.

            Every Bash call must be one simple command. The allowlist matches a
            command prefix, so pipes, `xargs`, `find`, `&&`, and multi-line
            scripts are all rejected. Run `git diff origin/main...HEAD --name-only`
            on its own; do not pipe it into anything.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) only for Blockers, anchored to the offending
            lines. Do not write or edit anything inside the repository working
            tree; `/tmp` only.

          claude_args: |
            --max-turns 120
            --add-dir /tmp
            --disallowedTools "Edit,NotebookEdit,WebFetch,WebSearch"
            --allowedTools "Task,Read,Grep,Glob,TodoWrite,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),Bash(git fetch:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(head:*),Bash(tail:*)"

      # The Claude App refuses to run when this workflow file differs from the
      # copy on the default branch, and the action still exits 0. Without this
      # check that skip reports green and reviews nothing.
      - name: Assert the reviewer actually ran
        if: always()
        run: |
          if [[ -z "${{ steps.claude.outputs.execution_file }}" ]]; then
            echo "::error::The Claude App skipped this run. Almost always this PR edits" \
                 ".github/workflows/claude-pr-review.yml, which must match the copy on the" \
                 "default branch. Land the workflow change on the default branch first."
            exit 1
          fi

      # Denials are the reviewer's failure mode: the session ends "successfully"
      # having been blocked from the tools its protocol needs. The execution
      # file holds the unsanitized messages, so report just the denied tool
      # names and inputs -- never the transcript, this repository is public.
      - name: Report what the reviewer did
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          echo "Tools called, in order:"
          jq -r '
            [.[] | select(.type == "assistant") | .message.content[]?
                 | select(.type == "tool_use")
                 | .name + (if .name == "Task" then " -> " + (.input.subagent_type // "?") else "" end)]
            | if length == 0 then "  (none)" else group_by(.) | map("  \(length)x \(.[0])") | .[] end
          ' "${{ steps.claude.outputs.execution_file }}"
          echo
          jq -r '
            ([.[] | select(.type == "result")] | last | .permission_denials // [])
            | if length == 0 then
                "No permission denials."
              else
                "Denied tool calls (\(length)):",
                (.[] | "  \(.tool_name)  \((.tool_input | tostring)[0:180])")
              end
          ' "${{ steps.claude.outputs.execution_file }}"
          echo
          if [[ -f /tmp/pr-review.md ]]; then
            echo "Review body written: $(wc -c < /tmp/pr-review.md) bytes."
          else
            echo "Review body /tmp/pr-review.md was never written. The reviewer's"
            echo "closing message follows, in case it reviewed but did not save:"
            jq -r '
              [.[] | select(.type == "assistant") | .message.content[]?
                   | select(.type == "text") | .text] | last // "(no closing message)"
            ' "${{ steps.claude.outputs.execution_file }}"
          fi

      # Posting is CI's job, not the model's. The reviewer produces the file;
      # the workflow publishes it. Four runs failed on the model's own posting
      # step while the analysis itself was fine.
      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! -s /tmp/pr-review.md ]]; then
            echo "::error::The reviewer produced no review body at /tmp/pr-review.md." \
                 "See the report above for the tools it called and what was denied."
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-review.md
          echo "Posted the review to PR #$PR_NUMBER."

      - name: Assert the reviewer left the working tree untouched
        if: always()
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The reviewer modified the working tree; it must only read."
            git status --porcelain
            exit 1
          fi

      - name: Require approving review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          started_at="$(cat "$RUNNER_TEMP/review-started-at")"
          gh api --paginate \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | scripts/validate-hosted-review-artifact.sh \
                "$started_at" "$HEAD_SHA" \
            > "$RUNNER_TEMP/hosted-review.md"
          echo "Hosted reviewer posted an approving current-head artifact."
