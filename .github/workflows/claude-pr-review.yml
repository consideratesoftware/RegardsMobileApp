name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; review when a PR opens, updates, or leaves draft
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test review artifact validator
        run: scripts/tests/validate-hosted-review-artifact-tests.sh

      - name: Record review start
        run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/review-started-at"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the reviewer for Regards. The PR branch is checked out in
            the current working directory.

            Follow the repository's staged review protocol defined in
            `.claude/commands/pr-review.md`, with these CI adaptations:

            - Skip the Stage 0 mechanical gates (xcodegen determinism,
              swiftlint, privacy greps) — they run in the ios-ci, lint, and
              guards workflows on this PR. Instead, check their status with
              `gh pr checks` and report it in the PRE-FLIGHT line.
            - Read `ARCHITECTURE.md` §18 → §19 → §14 first, then the sections
              the diff touches. The dispatch table, merge rules, register
              hygiene (R-closure verification), and output format in
              `.claude/commands/pr-review.md` apply as written; use the
              project subagents in `.claude/agents/`.
            - Diff target: the PR's merge base with the base branch
              (`gh pr diff` or `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`).
            - Artifact identity: immediately after the review heading, add the
              line `HEAD SHA: ${{ github.event.pull_request.head.sha }}`.

            Post the single merged review (the exact Stage 3 structure) as one
            top-level comment via `gh pr comment`. Use
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) only for Blockers, anchored to the offending
            lines. Do not submit review text as plain messages, and do not
            modify any code.

          claude_args: |
            --allowedTools "Agent,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"

      - name: Require approving review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          started_at="$(cat "$RUNNER_TEMP/review-started-at")"
          gh api --paginate \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | scripts/validate-hosted-review-artifact.sh \
                "$started_at" "$HEAD_SHA" \
            > "$RUNNER_TEMP/hosted-review.md"
          echo "Hosted reviewer posted an approving current-head artifact."
