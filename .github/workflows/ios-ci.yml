name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

# Path filters were intentionally removed: branch protection requires
# the iOS CI checks to pass, and a path-filtered workflow doesn't run
# on unrelated-paths PRs (gitignore tweaks, root README edits, etc.).
# The resulting "required check missing" status blocks merge. We pay
# ~10 min of CI on every PR in exchange for the gate always being
# answerable.

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"
  DOMAIN_COVERAGE_MIN: "95"
  # `OS=latest` alone doesn't pick a device — xcodebuild needs a name to
  # disambiguate. iPhone 17 Pro is the project's pinned test device and
  # resolves to the image's latest installed iOS runtime. Keep this device
  # pin aligned with AGENTS.md.
  SIMULATOR: "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest"
  SCHEME: Regards

jobs:
  xcodegen-determinism:
    name: xcodegen determinism
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Regenerate project
        working-directory: ios
        run: xcodegen generate
      - name: Assert committed xcodeproj matches project.yml
        run: |
          if ! git diff --exit-code ios/Regards.xcodeproj; then
            echo "::error::Regards.xcodeproj is out of date. Run 'cd ios && xcodegen generate' and commit the result."
            exit 1
          fi

  build:
    name: Build
    runs-on: macos-latest
    needs: xcodegen-determinism
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      # GitHub's macos-latest image may install Xcode without the iOS
      # platform. Even building against the iOS Simulator SDK requires the
      # platform; install before any xcodebuild step that targets iOS.
      - name: Install iOS platform
        # Wrap in a retry loop — `xcodebuild -downloadPlatform iOS`
        # intermittently fails with "Unable to connect to simulator"
        # against Apple's CDN (observed twice in 24h on the macos-latest
        # image). Three attempts with 15s backoff has been enough each
        # time. No-op cost when healthy.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              [ "$attempt" -gt 1 ] && echo "downloadPlatform succeeded on attempt $attempt (after retries)"
              exit 0
            fi
            echo "::warning::downloadPlatform failed on attempt $attempt; sleeping 15s before retry"
            sleep 15
          done
          echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts"
          exit 1
      - name: Build
        working-directory: ios
        # `generic/platform=iOS Simulator` resolves against the SDK
        # without booting a device — fine for `build`, since we only need
        # the artifacts. Test jobs use the bootable destination instead.
        run: |
          set -o pipefail
          xcodebuild \
            -project Regards.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | xcbeautify --renderer github-actions

  unit-tests:
    name: Unit tests + coverage
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install iOS platform
        # Wrap in a retry loop — `xcodebuild -downloadPlatform iOS`
        # intermittently fails with "Unable to connect to simulator"
        # against Apple's CDN (observed twice in 24h on the macos-latest
        # image). Three attempts with 15s backoff has been enough each
        # time. No-op cost when healthy.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              [ "$attempt" -gt 1 ] && echo "downloadPlatform succeeded on attempt $attempt (after retries)"
              exit 0
            fi
            echo "::warning::downloadPlatform failed on attempt $attempt; sleeping 15s before retry"
            sleep 15
          done
          echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts"
          exit 1
      - name: Run RegardsTests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Regards.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR" \
            -configuration Debug \
            -only-testing:RegardsTests \
            -resultBundlePath build/RegardsTests.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test \
            | xcbeautify --renderer github-actions
      - name: Enforce Domain coverage floor
        run: scripts/check-domain-coverage.sh ios/build/RegardsTests.xcresult
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RegardsTests.xcresult
          path: ios/build/RegardsTests.xcresult

  accessibility-audit:
    name: Accessibility audit
    # Off the pull-request path, same as the 5x stress sweep. Both audits are
    # macos-latest and bill at 10x Linux; between them they were the dominant
    # cost of every push. This job still runs on merges to main; the deeper 5x
    # sweep in audit-stress.yml adds nightly and on-demand runs. See that
    # workflow's header for the numbers and the release-gate procedure.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install iOS platform
        # Wrap in a retry loop — `xcodebuild -downloadPlatform iOS`
        # intermittently fails with "Unable to connect to simulator"
        # against Apple's CDN (observed twice in 24h on the macos-latest
        # image). Three attempts with 15s backoff has been enough each
        # time. No-op cost when healthy.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              [ "$attempt" -gt 1 ] && echo "downloadPlatform succeeded on attempt $attempt (after retries)"
              exit 0
            fi
            echo "::warning::downloadPlatform failed on attempt $attempt; sleeping 15s before retry"
            sleep 15
          done
          echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts"
          exit 1
      - name: Run RegardsAccessibilityTests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Regards.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR" \
            -configuration Debug \
            -only-testing:RegardsAccessibilityTests \
            -resultBundlePath build/RegardsAccessibilityTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test \
            | xcbeautify --renderer github-actions
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RegardsAccessibilityTests.xcresult
          path: ios/build/RegardsAccessibilityTests.xcresult

  # Snapshot tests (swift-snapshot-testing) are deferred out of Phase 0.
  # The a11y audit + manual VoiceOver smoke (`ios/docs/accessibility-smoke.md`)
  # gate the UI shell today; snapshotting lands when we have a real design
  # pass and baseline images are worth maintaining.
